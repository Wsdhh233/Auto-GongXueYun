name: "打卡"

on:
  workflow_dispatch:
  schedule:
    # 北京 8:00-8:30 内随机执行，两个 cron 冗余，重复无所谓
    - cron: "0 0 * * 1-5"    # 北京 8:00 触发
    - cron: "15 0 * * 1-5"   # 北京 8:15 触发（冗余）

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install depend
      run: |
        pip install certifi
        pip install cffi
        pip install charset-normalizer
        pip install cryptography
        pip install idna
        pip install numpy
        pip install opencv-python
        pip install pycparser
        pip install requests
        pip install urllib3

    - name: Random delay into 08:00-08:30 window
      shell: bash
      run: |
        case "${{ github.event.schedule }}" in
          "0 0 * * 1-5")  window=1800 ;;  # 北京 8:00 触发，0–1799 秒
          "15 0 * * 1-5") window=900  ;;  # 北京 8:15 触发，0–899 秒
          *)              window=0    ;;  # 手动触发不延迟
        esac
        if [ "$window" -gt 0 ]; then
          delay=$((RANDOM % window))
          echo "Sleeping $delay s (window=$window) at $(TZ=Asia/Shanghai date '+%F %T')"
          sleep "$delay"
        fi

    - name: Start sign
      env:
        USER: ${{ secrets.USER }}
      run: |
        echo "实际执行时间（北京）：$(TZ=Asia/Shanghai date '+%F %T')"
        python index.py
